<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Videogamedle</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="input.css" />
<style>
  :root { box-sizing: border-box; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .modal-backdrop { animation: fadeIn 0.2s ease-out; }
  .modal-box { animation: scaleIn 0.25s ease-out; }
</style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col justify-end items-center p-6 relative">
<script src="./scripts/shared_background_chooser.js"></script>

  <h2 class="absolute top-6 left-1/2 -translate-x-1/2 text-2xl font-semibold text-slate-400 text-center">From what game is this image from?</h2>

  <!--Számítások szerint majd ide jönnek a képek-->

  <div class="text-center justify-end">
    <div class="relative w-full">
      <ul id="autocompleteList"
        class="hidden absolute bottom-full left-0 mb-2 w-full max-h-48 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-lg text-left z-10">
      </ul>
      <input id="guessInput" type="text" autocomplete="off" placeholder="Guess here..." class="w-full px-4 py-2 rounded-full focus:outline-none" style="color: black;">
    </div>
    <button class="mt-4 px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700">
      Guess
    </button>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
    <div class="modal-box bg-slate-900 rounded-2xl shadow-xl max-w-2xl w-full p-8 relative">
      <h2 class="text-3xl font-bold text-slate-200 mb-3">Mode selected</h2>
      <p class="text-slate-600 text-lg mb-6">
        Choose a difficulty setting
      </p>

      <div class="grid grid-cols-3 gap-4 mb-8">
        <button type="button" data-choice="1"
          class="choice-box flex flex-col items-center justify-center text-center p-5 min-h-[180px] rounded-xl border-2 border-slate-200 hover:border-slate-400 transition">
          <span class="choice-title font-semibold text-slate-500 text-base mb-2">Easy</span>
          <span class="choice-desc text-sm text-slate-400 leading-snug">The games in this difficulty are games that have been released in recent years or are too popular to be forgotten.</span>
        </button>
        <button type="button" data-choice="2"
          class="choice-box flex flex-col items-center justify-center text-center p-5 min-h-[180px] rounded-xl border-2 border-slate-200 hover:border-slate-400 transition">
          <span class="choice-title font-semibold text-slate-500 text-base mb-2">Medium</span>
          <span class="choice-desc text-sm text-slate-400 leading-snug">In this difficulty, the game pool is expanded to games that are older and not as well-known. </span>
        </button>
        <button type="button" data-choice="3"
          class="choice-box flex flex-col items-center justify-center text-center p-5 min-h-[180px] rounded-xl border-2 border-slate-200 hover:border-slate-400 transition">
          <span class="choice-title font-semibold text-slate-500   text-base mb-2">Wildcard</span>
          <span class="choice-desc text-sm text-slate-400 leading-snug">Do you think you've got what it takes? Think you've got the smallest of details down? Well, you might get lucky...</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const backdrop = document.getElementById('modalBackdrop');
    
    function closeModal() {
      backdrop.classList.add('hidden');
    }
    function openModal() {
      backdrop.classList.remove('hidden');
    }
    

    // Kockák kiválasztása - a választás egyben bezárja a modalt
    let selectedChoice = null;
    const choiceBoxes = document.querySelectorAll('.choice-box');
    choiceBoxes.forEach(box => {
      box.addEventListener('click', () => {
        choiceBoxes.forEach(b => {
          b.classList.remove('border-slate-800', 'bg-slate-50');
          b.classList.add('border-slate-200');
        });
        box.classList.remove('border-slate-200');
        box.classList.add('border-slate-800', 'bg-slate-50');
        selectedChoice = box.dataset.choice; // "1", "2" vagy "3"
        closeModal();
        fetchGamesByValue(selectedChoice);
      });
    });

    // games.json lekérése és szűrés a kiválasztott érték alapján
    async function fetchGamesByValue(value) {
      try {
        const response = await fetch('./JSON/games.json');
        if (!response.ok) {
          throw new Error(`HTTP hiba: ${response.status}`);
        }
        const data = await response.json();

        const matches = data.games.filter(item => String(item.difficulty) <= String(value));

        console.log(`Sikeres fetch! Kiválasztott érték: ${value}`);
        console.log('Találatok:', matches);
        console.log(data.games);
      } catch (error) {
        console.log('A fetch nem sikerült:', error.message);
      }
    }

    // ---- Autocomplete a kereső mezőhöz ----
    const guessInput = document.getElementById('guessInput');
    const autocompleteList = document.getElementById('autocompleteList');
    let allGames = [];

    // Játékadatok betöltése a games.json-ból
    async function loadGameTitles() {
      try {
        const response = await fetch('./JSON/games.json');
        if (!response.ok) throw new Error(`HTTP hiba: ${response.status}`);
        const data = await response.json();
        // A games.json-ban minden elemnek "name" (string) és "images.preview" mezője van
        allGames = data.games
          .filter(item => item.name)
          .map(item => ({ title: item.name, image: (item.images && item.images.preview) || '' }));
      } catch (error) {
        console.log('Nem sikerült betölteni a játéklistát az autocomplete-hoz:', error.message);
      }
    }
    loadGameTitles();

    function renderSuggestions(matches) {
      autocompleteList.innerHTML = '';
      if (matches.length === 0) {
        autocompleteList.classList.add('hidden');
        return;
      }
      matches.forEach(game => {
        const li = document.createElement('li');
        li.className = 'flex items-center gap-3 px-4 py-2 cursor-pointer hover:bg-slate-100 text-slate-700';

        const img = document.createElement('img');
        img.src = game.image;
        img.alt = game.title;
        img.className = 'w-10 h-10 object-cover rounded-md bg-slate-200 flex-shrink-0';
        img.onerror = () => { img.style.visibility = 'hidden'; };

        const span = document.createElement('span');
        span.textContent = game.title;

        li.appendChild(img);
        li.appendChild(span);

        li.addEventListener('click', () => {
          guessInput.value = game.title;
          autocompleteList.classList.add('hidden');
        });
        autocompleteList.appendChild(li);
      });
      autocompleteList.classList.remove('hidden');
    }

    guessInput.addEventListener('input', () => {
      const query = guessInput.value.trim().toLowerCase();
      if (query === '') {
        autocompleteList.classList.add('hidden');
        return;
      }
      const matches = allGames.filter(game =>
        game.title.toLowerCase().includes(query)
      );
      renderSuggestions(matches);
    });

    // Lista elrejtése, ha máshova kattintanak
    document.addEventListener('click', (e) => {
      if (!guessInput.contains(e.target) && !autocompleteList.contains(e.target)) {
        autocompleteList.classList.add('hidden');
      }
    });
  </script>

</body>
</html>
