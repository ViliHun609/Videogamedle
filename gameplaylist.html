async function loadGames() {
  const response = await fetch('./JSON/games.json');
  const data = await response.json();
  //console.log(data.games)

  const replace = await fetch('./TMP/img2replace');
  const replaceGames = await replace.text();
  // Source - https://stackoverflow.com/a/686124

  let lines = replaceGames.split("\n");
  console.log(lines)
  readLines(lines, data.games)
  
  displayGames(data.games)
  title.innerText = `Here is all of the ${data.games.length} games you can choose from`
  
  
  return data
}


function readLines(list, games) {

  for (let i = 0; i < list.length; i++) {
    for (let j = 0; j < games.length; j++) {
      if (list[i].trim() === games[j].id) {
        needReplace.push(games[j].id)
        console.log(games[j].id);
      }
    }
  }
}

function displayGames(games) {
  for (let j = 0; j < games.length; j++) {
    const number = j + 1;
    const currentGame = games[j];
    let needs = false;

    for (let i = 0; i < needReplace.length; i++) {
      if (needReplace[i].trim() === currentGame.id) {
        needs = true;
        break;
      }
    }

    gridDiv.innerHTML += `
      <div class="ink-wash p-8 rounded-2xl flex flex-wrap flex-col element-hover hover-list-element relative game-card min-w-52">
        <div class="overflow-hidden rounded-2xl ink-style">
          <img src="${currentGame.images.gameplay}" alt="picture of ${currentGame.name}">
        </div>

        <span class="absolute top-2 left-2 px-2 py-1 rounded-lg ink-wash text-sm font-bold ${needs ? 'text-red-500' : ''}">
          #${number}
        </span>

        <div class="p-4 flex flex-col gap-2 mt-4">
          <h3 class="text-lg font-bold leading-none ${needs ? 'text-red-500' : ''}">${currentGame.name}</h3>
          <p class="text-sm mt-2 ${needs ? 'text-red-500' : 'opacity-70'}">${needs ? 'Needs replacement' : currentGame.developer}</p>
        </div>
