<script>
// get games


function random(min, max) {
  const num = Math.floor(Math.random() * (max - min + 1)) + min;
  return num;
}

// Source - https://stackoverflow.com/a/63473804
// Posted by 3limin4t0r

// reformatted with those 2 sources
function imageExists(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}
// --------------------------------------------------

const testplace = document.getElementById("testplace")
function printgameid(game) {
    testplace.innerHTML = game.id;
}

async function loadGames() {
  const response = await fetch('./JSON/games.json');
  const data = await response.json();
  

  const selectedIndex = await getRandomIndexDaily(data);
  const selectedGame = data.games[selectedIndex];
  
  //load getRandomDaily
  //console.log(selectedGame)
  
  // get the games picture based on selected game
  img.src = `./assets/games/${selectedGame.id}/gameplay.jpg`
  
  //console.log(selectedGame.images)
  
  return data
}

// get random game
async function getRandomIndexDaily(data) {
    // const d = new Date();
    // const year = d.getFullYear();
    // const month = d.getMonth() + 1; 
    // const day = d.getDate();

    // const fulldate = `${year}` + `${month}` + `${day}`;
    
    // let selectedIndex = fulldate % data.games.length

    const gameWImg = []
    //const exists = await imageExists('./assets/the-forest/gameplay.jpg');
    //console.log(exists);
    //console.log(data.games[40].images.gameplay.complete)
    for(let i = 0; i < data.games.length; i++) {
        if(await imageExists(`./assets/games/${data.games[i].id}/gameplay.jpg`) == true) {
            gameWImg.push(i)
        }
    }
    const arrayIndex = random(0, gameWImg.length-1)

    //console.log(gameWImg)
    //console.log(arrayIndex)
    const selectedIndex = gameWImg[arrayIndex]
    //console.log(selectedIndex)
    return selectedIndex
}





//  zoom in on image and zoom display
const img = document.querySelector("#game-img");
const currentWidth = img.clientWidth;
let guesses = 0;

const button = document.querySelector("#btn")

const steps = [10, 8, 6, 4, 2, 1];
const zoom = document.querySelector("#zoom")
const counter = document.querySelector("#test-counter") 

img.style.transform = `scale(${steps[guesses]})`;
zoom.innerHTML = `${steps[guesses]}X Zoom`

//console.log(counter)

function guess() {
    if(guesses + 2 > steps.length) {
        guesses++
        counter.innerHTML = guesses
    } else {
        guesses++
        zoom.innerHTML = `${steps[guesses]}X Zoom`
        img.style.transform = `scale(${steps[guesses]})`;
        counter.innerHTML = guesses
    }
}
button.addEventListener("click", guess)





loadGames();
