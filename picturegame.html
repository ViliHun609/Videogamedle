<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videogamedle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="input.css" />

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.1/jquery.min.js"></script>
</head>
<body class="h-screen flex flex-col">
    <script src="./scripts/shared_background_chooser.js"></script>

<header class="shrink-0">
    <nav class="w-full z-20 ink-wash">
        <div class="max-w-screen grid grid-cols-3 items-center mx-auto p-4">

            <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="./images/logo/logo.png" class="h-7" alt="Videogamedle Logo" />
                <span class="self-center text-xl text-heading font-semibold whitespace-nowrap portal_like">Videogamedle</span>
            </a>

            <div class="justify-self-center hidden w-full md:flex md:w-auto justify-center" id="navbar-user">
                <a href="./index.html" class="text-center align-center flex" id="homepage_link">
                    <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                      <polyline points="14 17 9 12 14 7"></polyline>
                    </svg>
                    <b>back to homepage</b>
     
                </a>
            </div>

            <div class="flex items-center justify-self-end md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button type="button" class="flex text-sm bg-neutral-primary rounded-full md:me-0 focus:ring-4 focus:ring-neutral-tertiary" id="user-menu-button" aria-expanded="false">
                    <span class="sr-only">Open user menu</span>
                    <a href="./profile.html">
                        <img class="w-8 h-8 rounded-full" src="./assets/games/satisfactory/preview.jpg" alt="user photo">
                    </a>
                </button>

            </div>

            
        </div>
    </nav>


</header>

<main class="w-screen text-center h-screen mt-8">

  <h1 class="pb-2 text-5xl uppercase portal_like">Picturegamedle</h1>
  <h2 class="pb-20">Guess the game based on the zoomed in picture</h2>

  <div class="grid-cols-1 grid items-center gap-32" >

    <div class="bg-black align-center m-auto w-4/12 overflow-hidden aspect-video rounded-md ink-wash border-4" id="gamepic">
        <div class="overflow-hidden">
        <img src="./assets/games/beamng-drive/gameplay.jpg" alt="" id="game-img" class="aspect-video">
        </div>
    </div>


    <div class="">
        <p>kereso</p>
        <button id="btn">
            <b>+1 guess</b>
        </button>
    </div>
  </div>

</main>

<footer class="py-4 text-center text-xs w-full flex items-center justify-center h-fit">
<p class="text-sm tracking-wide w-1/6 border-2 rounded-md h-fit content-center p-4 ink-wash portal_like_animation" style="border: 1px solid var(--portal-orange);">
    Take a look at the project on GitHub
	<a class="underline font-bold" href="https://github.com/ViliHun609/Videogamedle" target="_blank">
	here
	<svg class="footer-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 14v4.833A1.166 1.166 0 0 1 16.833 20H5.167A1.167 1.167 0 0 1 4 18.833V7.167A1.166 1.166 0 0 1 5.167 6h4.618m4.447-2H20v5.768m-7.889 2.121 7.778-7.778"/></svg>
	</a>
</p>
</footer>

<script>

const img = document.querySelector("#game-img");
const currentWidth = img.clientWidth;
let guesses = 0;

const button = document.querySelector("#btn")

const steps = [10, 8, 6, 4, 2, 1];

img.style.transform = `scale(${steps[guesses]})`;

async function loadGames() {
  const response = await fetch('./JSON/games.json');
  const data = await response.json();
  const games = data.games;
  console.log(games[0].name);
}
loadGames();    

</script>
</body>

</html>
