<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="input.css" />
    <link rel="shortcut icon" href="./images/logo/logo.png" type="image/x-icon">
</head>
<body class="min-h-screen h-fit flex flex-col">
<script src="./scripts/shared_background_chooser.js"></script>

<header class="shrink-0">
    <nav class="w-full z-20 ink-wash">
        <div class="max-w-screen grid grid-cols-3 items-center mx-auto px-4 py-2">

            <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="./images/logo/logo.png" class="h-7" alt="Videogamedle Logo" />
                <span class="self-center text-xl text-heading font-semibold whitespace-nowrap portal_like">Videogamedle</span>
            </a>

            <div class="justify-self-center hidden w-full md:flex md:w-auto justify-center" id="navbar-user">
                <a href="./index.html" class="text-center align-center flex" id="homepage_link">
                    <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                      <polyline points="14 17 9 12 14 7"></polyline>
                    </svg>
                    <b>back to homepage</b>
     
                </a>
            </div>
            

            
        </div>
    </nav>
</header>

<main class="w-full flex flex-col flex-1 min-h-0 text-center px-16 py-4 justify-center">

    <div class="flex h-fit w-full gap-8">

        <section class="flex flex-col w-3/12 gap-4 h-full p-4 pb-8 items-center justify-between text-center mt-12 rounded-2xl ink-wash">

            <div id="profile" class="flex flex-col items-center justify-center mt-10 w-full h-fit">
                <img src="./assets/games/terraria/preview.jpg" alt="profile picture" title="profile picture" class="rounded-full w-3/6 object-cover">
            </div>

            <div class="w-full h-2/6 mb-20">
                <h2 class="text-2xl">Favorite game:</h2>
                <h2 class="text-xl mb-6">Game name</h2>
                <img src="./assets/games/satisfactory/preview.jpg" alt="" class="rounded-md w-6/12 m-auto ">
            </div>


            <a href="" class="w-full h-18 p-4 grid place-content-center text-3xl rounded-3xl font-secondary sign-out">
                <span>sign out</span>
            </a>
        </section>


        <section class="w-9/12 p-4 flex flex-col min-h-0 mt-2">
            <h1 class="text-6xl font-secondary text-left">koneszka-31</h1>
            <h2 class="text-lg font-secondary text-left">join date - 2026.08.07.</h2>

            <div class="flex-1 min-h-0 justify-center p-12 rounded-2xl mt-6 ink-wash">
                <div class="grid grid-cols-2 gap-12">
                    <div class="border-2 h-24 rounded-2xl align-center">
                        <span>Games played</span>
                    </div>

                    <div class="border-2 h-24">
                        <span>Win rate (%)</span>
                    </div>

                    <div class="border-2 h-24">
                        <span>current streak</span>
                    </div>

                    <div class="border-2 h-24">
                        <span>max streak</span>
                    </div>
                </div>
            </div>

    </section>

    </div>

</main>

<footer class="py-4 text-center text-xs w-full flex items-center justify-center h-fit">
<p class="text-sm tracking-wide w-1/6 border-2 rounded-md h-fit content-center p-4 ink-wash" style="border: 1px solid var(--portal-orange);">
    Take a look at the project on GitHub
	<a class="underline font-bold" href="https://github.com/ViliHun609/Videogamedle" target="_blank">
	here
	<svg class="footer-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 14v4.833A1.166 1.166 0 0 1 16.833 20H5.167A1.167 1.167 0 0 1 4 18.833V7.167A1.166 1.166 0 0 1 5.167 6h4.618m4.447-2H20v5.768m-7.889 2.121 7.778-7.778"/></svg>
	</a>
</p>
</footer>

</body>
</html>
